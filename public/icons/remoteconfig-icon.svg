<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 750" width="750" height="750" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="disc"><circle cx="343" cy="367" r="252"/></clipPath>

    <radialGradient id="oTop" cx="400" cy="190" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD9400"/>
      <stop offset="1" stop-color="#FD9400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oLeft" cx="140" cy="310" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD9400"/>
      <stop offset="1" stop-color="#FD9400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oRight" cx="480" cy="330" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD9400"/>
      <stop offset="1" stop-color="#FD9400" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="frontBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9D83C"/>
      <stop offset="1" stop-color="#F2CF4A"/>
    </linearGradient>
    <linearGradient id="backBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6A21E"/>
      <stop offset="1" stop-color="#F28C0A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="6" stdDeviation="7" flood-color="#8a4a00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Lingkaran latar -->
  <g clip-path="url(#disc)">
    <rect width="750" height="750" fill="#FFC400"/>
    <rect width="750" height="750" fill="url(#oTop)"/>
    <rect width="750" height="750" fill="url(#oLeft)"/>
    <rect width="750" height="750" fill="url(#oRight)"/>
  </g>

  <!-- Dua panah hitam -->
  <g fill="none" stroke="#000" stroke-width="24" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M209 440 H262 Q284 440 284 418 V315 Q284 293 306 293 H436"/>
    <path d="M388 246 L436 293 L388 340"/>
    <path d="M319 440 H436"/>
    <path d="M388 393 L436 440 L388 487"/>
  </g>

  <!-- Kartu ponsel belakang (oranye) -->
  <g transform="rotate(8 610 530)" filter="url(#shadow)">
    <rect x="566" y="410" width="88" height="244" rx="14" fill="#F4ECF1"/>
    <rect x="571" y="415" width="78" height="234" rx="11" fill="url(#backBody)"/>
    <rect x="578" y="498" width="62" height="50" rx="8" fill="#F8E3A8"/>
    <g fill="#FFF3D6">
      <rect x="580" y="562" width="58" height="8" rx="4"/>
      <rect x="580" y="578" width="54" height="8" rx="4"/>
      <rect x="580" y="594" width="38" height="8" rx="4"/>
    </g>
  </g>

  <!-- Kartu ponsel depan (kuning) -->
  <g transform="rotate(17 508 520)" filter="url(#shadow)">
    <rect x="448" y="385" width="120" height="272" rx="18" fill="#F4ECF1"/>
    <rect x="455" y="392" width="106" height="258" rx="13" fill="url(#frontBody)"/>
    <rect x="463" y="402" width="90" height="108" rx="12" fill="#F0ECEE"/>
    <g fill="#FFF4C4">
      <rect x="466" y="524" width="84" height="9" rx="4.5"/>
      <rect x="466" y="542" width="80" height="9" rx="4.5"/>
      <rect x="466" y="560" width="52" height="9" rx="4.5"/>
    </g>
  </g>
</svg>
