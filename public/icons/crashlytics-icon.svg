<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1920" width="1920" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Latar lingkaran: kuning dasar + bercak oranye -->
    <radialGradient id="gTop" cx="880" cy="400" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD9400"/>
      <stop offset="1" stop-color="#FD9400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gLeft" cx="420" cy="1150" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD9400"/>
      <stop offset="1" stop-color="#FD9400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gRight" cx="1130" cy="1300" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD9400"/>
      <stop offset="1" stop-color="#FD9400" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="885" cy="945" r="650"/></clipPath>

    <!-- Badan serangga -->
    <radialGradient id="bug" cx="1450" cy="1180" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4A28"/>
      <stop offset="1" stop-color="#D81C08"/>
    </radialGradient>
    <radialGradient id="head" cx="1390" cy="1150" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A33"/>
      <stop offset="1" stop-color="#E8280F"/>
    </radialGradient>

    <!-- Potong area kanan-atas glyph (celah cincin) -->
    <mask id="glyphMask">
      <rect width="1920" height="1920" fill="#fff"/>
      <rect x="978" y="600" width="400" height="375" fill="#000"/>
    </mask>
  </defs>

  <!-- Lingkaran latar -->
  <g clip-path="url(#disc)">
    <rect width="1920" height="1920" fill="#FDC200"/>
    <rect width="1920" height="1920" fill="url(#gTop)"/>
    <rect width="1920" height="1920" fill="url(#gLeft)"/>
    <rect width="1920" height="1920" fill="url(#gRight)"/>
  </g>

  <!-- Glyph hitam: 6 lengan + cincin + titik -->
  <g mask="url(#glyphMask)" fill="#000">
    <circle cx="900" cy="945" r="190"/>
    <rect x="822" y="630" width="156" height="250" rx="45"/>
    <rect x="822" y="630" width="156" height="250" rx="45" transform="rotate(-45 900 945)"/>
    <rect x="822" y="630" width="156" height="250" rx="45" transform="rotate(-90 900 945)"/>
    <rect x="822" y="630" width="156" height="250" rx="45" transform="rotate(-135 900 945)"/>
    <rect x="822" y="630" width="156" height="250" rx="45" transform="rotate(180 900 945)"/>
    <rect x="822" y="630" width="156" height="250" rx="45" transform="rotate(135 900 945)"/>
  </g>
  <circle cx="900" cy="945" r="141" fill="#FD9600"/>
  <circle cx="900" cy="945" r="63" fill="#000"/>

  <!-- Kaki serangga -->
  <g fill="none" stroke-linecap="round" stroke-width="12">
    <path d="M1272 1172 Q1300 1150 1340 1152" stroke="#F0361A"/>
    <path d="M1310 1250 Q1330 1244 1356 1256" stroke="#F0361A"/>
    <path d="M1415 1028 Q1390 1060 1402 1105" stroke="#F0361A"/>
    <path d="M1486 1072 Q1492 1095 1488 1118" stroke="#F0361A"/>
    <path d="M1516 1122 Q1545 1100 1580 1100" stroke="#FD8A1A"/>
    <path d="M1620 1215 Q1648 1210 1668 1218" stroke="#FD9A1A"/>
    <path d="M1360 1290 Q1340 1320 1345 1350" stroke="#F0361A"/>
    <path d="M1440 1440 Q1432 1405 1445 1380" stroke="#F0361A"/>
  </g>

  <!-- Badan & kepala serangga -->
  <circle cx="1405" cy="1190" r="72" fill="url(#head)"/>
  <ellipse cx="1500" cy="1262" rx="128" ry="135" fill="url(#bug)"/>
  <!-- Mata -->
  <g fill="#262626">
    <rect x="1380" y="1166" width="76" height="30" rx="15" transform="rotate(-38 1418 1181)"/>
    <rect x="1426" y="1216" width="76" height="30" rx="15" transform="rotate(-38 1464 1231)"/>
  </g>

  <!-- Gagang jaring -->
  <line x1="945" y1="1597" x2="1305" y2="1345" stroke="#E4DDE0" stroke-width="44" stroke-linecap="round"/>
  <line x1="945" y1="1592" x2="1305" y2="1340" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>

  <!-- Kantung jaring -->
  <path d="M1330 1380 C1340 1480 1420 1545 1500 1545 C1620 1545 1710 1480 1712 1400 C1714 1320 1690 1220 1660 1150"
        fill="#FFFFFF" fill-opacity="0.12" stroke="#EDE8EA" stroke-width="10" stroke-linecap="round"/>
  <g fill="none" stroke="#F4F0F2" stroke-width="9" stroke-linecap="round">
    <path d="M1380 1350 C1400 1440 1440 1500 1490 1540"/>
    <path d="M1450 1320 C1470 1420 1500 1490 1530 1545"/>
    <path d="M1540 1300 C1560 1400 1580 1480 1590 1540"/>
    <path d="M1620 1250 C1650 1350 1660 1440 1650 1520"/>
    <path d="M1335 1395 C1450 1430 1620 1430 1710 1395"/>
    <path d="M1350 1450 C1450 1480 1610 1480 1698 1450"/>
    <path d="M1400 1510 C1480 1525 1590 1525 1660 1505"/>
  </g>

  <!-- Bibir/rim jaring (depan) -->
  <ellipse cx="1470" cy="1228" rx="228" ry="58" transform="rotate(-31 1470 1228)"
           fill="none" stroke="#E4DDE0" stroke-width="34"/>
  <ellipse cx="1470" cy="1224" rx="228" ry="58" transform="rotate(-31 1470 1224)"
           fill="none" stroke="#FFFFFF" stroke-width="24"/>
</svg>
