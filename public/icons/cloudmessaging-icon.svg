<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 750" width="750" height="750" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="disc"><circle cx="343" cy="367" r="252"/></clipPath>

    <radialGradient id="oLeft" cx="130" cy="385" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD9400"/>
      <stop offset="1" stop-color="#FD9400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oTopLeft" cx="190" cy="285" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD9400" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FD9400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oCenter" cx="320" cy="322" r="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD9400" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FD9400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oBottom" cx="250" cy="500" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDA800" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FDA800" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wingTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6E9EE"/>
    </linearGradient>
    <linearGradient id="wingShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1E3E9"/>
      <stop offset="1" stop-color="#E4D0D9"/>
    </linearGradient>
  </defs>

  <!-- Lingkaran latar -->
  <g clip-path="url(#disc)">
    <rect width="750" height="750" fill="#FFC400"/>
    <rect width="750" height="750" fill="url(#oLeft)"/>
    <rect width="750" height="750" fill="url(#oTopLeft)"/>
    <rect width="750" height="750" fill="url(#oCenter)"/>
    <rect width="750" height="750" fill="url(#oBottom)"/>
  </g>

  <!-- Awan (outline hitam) -->
  <path d="M320 440 H274
           A52 52 0 1 1 275.5 335.1
           A71 71 0 1 1 416 354.3
           A39 39 0 0 1 465 392"
        fill="none" stroke="#000" stroke-width="26" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- Panah kirim -->
  <polygon points="343,368 490,428 343,490 343,445 408,428 343,411" fill="#000"/>

  <!-- Jejak putus-putus -->
  <path d="M200 582 Q215 610 300 612 T 436 580"
        fill="none" stroke="#FBEFF3" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12"/>

  <!-- Pesawat kertas -->
  <g stroke-linejoin="round">
    <polygon points="393,503 657,437 485,540" fill="url(#wingTop)"/>
    <polygon points="485,540 657,437 490,593" fill="url(#wingShade)"/>
    <polygon points="393,503 485,540 445,572 424,545" fill="#F7EBF0"/>
    <polygon points="485,540 490,593 445,572" fill="#E9D6DE"/>
    <path d="M393 503 L485 540 L657 437" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    <path d="M485 540 L490 593" fill="none" stroke="#DCC6D0" stroke-width="1.5"/>
  </g>
</svg>
